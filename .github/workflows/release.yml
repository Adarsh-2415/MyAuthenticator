name: Publish GitHub Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Sign & ZipAlign APK for Device Compatibility
        uses: AndroidIDEOfficial/uber-apk-signer-action@v1.1
        with:
          apk-file-path: build/app/outputs/flutter-apk/app-release.apk

      - name: Prepare APK Asset
        run: |
          cp build/app/outputs/flutter-apk/app-release-aligned-signed.apk MyAuthenticator.apk

      - name: Create or Update Tagged Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: MyAuthenticator v1.0.0 Release
          body: "Production release build of MyAuthenticator. Zip-aligned & signed with V1/V2/V3 Android signatures for 100% device compatibility."
          files: MyAuthenticator.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
