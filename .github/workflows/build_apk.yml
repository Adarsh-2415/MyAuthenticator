name: Build Production Release APK

# Trigger build on push to main or master branch, or manual trigger
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Set up Java JDK 17
      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Set up Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 4. Install project dependencies
      - name: Install Dependencies
        run: flutter pub get

      # 5. Build lightweight Production Release APK
      - name: Build Production Release APKs
        run: flutter build apk --release --split-per-abi

      # 6. Upload ARM64 Release APK artifact (~18 MB)
      - name: Upload Production Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-arm64-release
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
